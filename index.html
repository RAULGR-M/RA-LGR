<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Para ti – Te Amo</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--c:#9c1a40;--p:#ec6a8d;--r:#d6275a;--t:#6b3a4a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Cormorant Garamond',Georgia,serif;color:var(--t);background:radial-gradient(circle at 50% 25%,#fff,#fdf5f7 55%,#f8e1e8) fixed;min-height:100vh;overflow:hidden}
button:focus-visible{outline:2px solid var(--r);outline-offset:4px}
.s{position:fixed;inset:0;z-index:1;display:none;flex-direction:column;align-items:center;overflow-y:auto;padding:max(1.5rem,env(safe-area-inset-top)) 1.2rem 3rem;text-align:center}
.s>:first-child{margin-top:auto}.s>:last-child{margin-bottom:auto}
.s.on{display:flex;animation:fade .9s both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
h1,h2{font-family:'Pinyon Script','Great Vibes',cursive;font-weight:400;color:var(--c);line-height:1.15}
h1{font-size:clamp(2.6rem,11vw,4.4rem)}
h2{font-size:2.3rem;margin:2.2rem 0 1rem}
.sub{font-style:italic;font-size:1.15rem;letter-spacing:.04em;margin-bottom:1.4rem}
#i{gap:1.8rem}
#fp{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;width:min(60vw,220px);aspect-ratio:1;border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,#fff,#fbf0f3 72%);box-shadow:0 16px 44px rgba(156,26,64,.14),inset 0 -10px 22px rgba(236,106,141,.12),inset 0 6px 14px #fff}
.f{width:54%;color:var(--p);transition:color 1.4s}
.pr{position:absolute;left:-7px;top:-7px;width:calc(100% + 14px);height:calc(100% + 14px);transform:rotate(-90deg)}
.pr circle{fill:none;stroke:var(--r);stroke-width:1.2;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .35s}
.ln{position:absolute;left:-12%;right:-12%;top:20%;height:2px;border-radius:2px;background:var(--r);box-shadow:0 0 12px 3px rgba(214,39,90,.4);opacity:0}
.hand{position:absolute;right:-6%;bottom:-2%;font-size:2.1rem;animation:tap 1.5s ease-in-out infinite}
@keyframes tap{50%{transform:translate(-5px,-7px) scale(.9)}}
#fp.go .f{color:var(--r)}
#fp.go .pr circle{stroke-dashoffset:0;transition:stroke-dashoffset 2.6s linear}
#fp.go .ln{opacity:1;animation:sc 1.3s ease-in-out 2 alternate forwards}
#fp.ok .ln{opacity:0;transition:opacity .4s}
#fp.go .hand{display:none}
@keyframes sc{to{top:80%}}
#st{font-style:italic;font-size:1.2rem;letter-spacing:.08em}
.envs{display:flex;gap:1.6rem;justify-content:center;flex-wrap:wrap;margin-bottom:1rem}
.env{position:relative;width:min(40vw,168px);aspect-ratio:1.4;margin-bottom:2.6rem;border:0;background:none;cursor:pointer;color:inherit;font:inherit;perspective:700px;animation:bob 3.4s ease-in-out infinite}
.env+.env{animation-delay:-1.7s}
@keyframes bob{50%{transform:translateY(-6px)}}
.bd,.fl{position:absolute;left:0;width:100%}
.bd{top:0;height:100%;border-radius:6px;background:linear-gradient(160deg,#fbdbe4,#f0a8bc);box-shadow:0 12px 26px rgba(156,26,64,.22)}
.bd::after{content:"";position:absolute;inset:0;border-radius:6px;background:linear-gradient(to top right,transparent 49%,rgba(156,26,64,.25) 50%,transparent 52%) left bottom/50% 64% no-repeat,linear-gradient(to top left,transparent 49%,rgba(156,26,64,.25) 50%,transparent 52%) right bottom/50% 64% no-repeat}
.fl{top:0;height:62%;background:linear-gradient(#e47c9a,#f19fb7);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .65s ease;z-index:2}
.env b{position:absolute;z-index:3;left:50%;top:62%;width:2rem;height:2rem;margin:-1rem 0 0 -1rem;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:1rem;box-shadow:0 3px 8px rgba(0,0,0,.25);transition:opacity .3s}
.env span{position:absolute;left:0;right:0;top:calc(100% + .7rem);font-style:italic;font-size:1.2rem}
.env.open .fl{transform:rotateX(180deg)}
.env.open b{opacity:0}
.btn{border:0;border-radius:999px;background:var(--c);color:#fff;font:600 1.25rem 'Cormorant Garamond',Georgia,serif;padding:.8rem 1.9rem;cursor:pointer;box-shadow:0 8px 20px rgba(156,26,64,.28)}
.btn.sm{align-self:flex-start;font-size:1rem;padding:.5rem 1.1rem}
.no{position:relative;z-index:5;background:#fff;color:var(--c);box-shadow:inset 0 0 0 2px var(--c),0 8px 20px rgba(156,26,64,.15)}
.no.yes{background:var(--c);color:#fff;box-shadow:0 8px 20px rgba(156,26,64,.28);animation:pop .5s}
@keyframes pop{50%{scale:1.35}}
.yn{display:flex;gap:1.6rem;align-items:center;justify-content:center;margin-top:4rem}
.yn .btn{font-size:1.5rem;padding:.8rem 2.2rem;touch-action:manipulation;transition:transform .35s ease,background .4s,color .4s}
#qb{margin-top:2.6rem}
#dog{max-width:min(86vw,420px);max-height:52vh;width:auto;height:auto;margin:1.2rem 0 1.8rem;border-radius:18px;background:#f8dfe6;box-shadow:0 14px 36px rgba(156,26,64,.25)}
#d.on #dog{animation:zoom .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes zoom{from{transform:scale(.6);opacity:0}}
.big{width:min(52vw,200px);filter:drop-shadow(0 14px 26px rgba(214,39,90,.35));animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.13)}30%{transform:scale(1)}45%{transform:scale(1.08)}}
.mo{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:1rem;background:rgba(70,15,35,.5);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.mo.on{display:grid;animation:fade .5s both}
.pp{position:relative;width:min(100%,560px);max-height:88vh;max-height:88dvh;overflow-y:auto;padding:2.6rem 1.7rem 2.2rem;border-radius:6px;background:linear-gradient(#fffefd,#fdf4f0);box-shadow:0 26px 60px rgba(50,8,25,.4);animation:up .7s both}
@keyframes up{from{transform:translateY(70px) scale(.96);opacity:0}}
.pp h2{margin:0 0 1rem;text-align:center}
#lx{white-space:pre-line;text-wrap:pretty;font-size:1.3rem;line-height:1.7;color:#4a2432}
.x{position:absolute;top:.3rem;right:.8rem;border:0;background:none;font-size:2.2rem;line-height:1;color:var(--c);cursor:pointer}
#li{max-width:100%;max-height:92vh;border-radius:8px}
#al{width:min(100%,920px)}
.g{columns:2;column-gap:.8rem}
.g img,.g video{width:100%;display:block;margin-bottom:.8rem;border-radius:10px;background:#f8dfe6;box-shadow:0 6px 18px rgba(156,26,64,.18);break-inside:avoid;cursor:pointer}
@media(min-width:720px){.g{columns:3}}
.h{position:fixed;bottom:-2rem;z-index:0;color:var(--p);opacity:.3;font-style:normal;pointer-events:none;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
@media(prefers-reduced-motion:reduce){.h{display:none}.env,.big{animation:none}}
</style>
</head>
<body>

<section class="s on" id="i">
  <h1>Para ti – Te Amo</h1>
  <button id="fp" aria-label="Escanear huella">
    <svg class="pr" viewBox="0 0 100 100"><circle cx="50" cy="50" r="49" pathLength="100"/></svg>
    <svg class="f" viewBox="0 0 120 150" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><g id="fg"></g></svg>
    <i class="ln"></i><span class="hand">👆</span>
  </button>
  <p id="st">Mantén presionada la huella</p>
</section>

<section class="s" id="m">
  <h1>Dos cartas para ti</h1>
  <p class="sub">Toca un sobre para abrirlo</p>
  <div class="envs">
    <button class="env" data-n="0"><i class="bd"></i><i class="fl"></i><b>♥</b><span>Hace un año</span></button>
    <button class="env" data-n="1"><i class="bd"></i><i class="fl"></i><b>♥</b><span>Me enamoré de ti</span></button>
  </div>
  <button class="btn" id="ab">Ver nuestro álbum ♥</button>
</section>

<section class="s" id="a">
  <button class="btn sm" id="bk">← Cartas</button>
  <h1>Nuestro álbum</h1>
  <div id="al"></div>
  <button class="btn" id="qb">Una última pregunta ♥</button>
</section>

<section class="s" id="q">
  <h1>¿Quieres ser mi novia?</h1>
  <p class="sub" id="qm">Responde con el corazón ♥</p>
  <div class="yn"><button class="btn" id="yes">Sí</button><button class="btn no" id="no">No</button></div>
</section>

<section class="s" id="d">
  <h2 id="dt"></h2>
  <img id="dog" alt="Perrito con mala cara">
  <button class="btn" id="back">← Volver a la pregunta</button>
</section>

<div class="mo" id="mo"><article class="pp"><button class="x" aria-label="Cerrar">×</button><h2 id="lt"></h2><p id="lx"></p></article></div>
<div class="mo" id="lb"><img id="li" alt=""></div>

<script>
const D='';
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);

const L=[['Hace un año',`Hace un año,
sin darme cuenta, ni sé cómo fue
el momento en que me enamoré
de esos hermosos ojos color miel.

Pegaste con cinta de aislar mi corazón quebrado.
No sé en qué momento esos “te quiero”
se convirtieron en un “te amo” de diario.

¿Quieres ser mi novia? Espero se permita
y esa pregunta no se repita.

Señorita, es que hace tiempo me siento bien,
porque teniéndote a mi lado mi vida se siente completa.
Cuando veo esa linda sonrisa coqueta,
me enamoré tanto que te escribo cada noche.

Antes no éramos nada y ahora eres mi todo.
Dicen que querer es poder, y yo puedo y quiero besarte,
y sin querer queriendo, créeme que logré quererte.

Eres mi damisela y tu nombre es el título
que escribo en las cartas que hago en mis libretas de la escuela,
y quiero entregarte completamente este amor sincero.

Nunca pensé enamorarme yo tanto de ti,
te fui queriendo día tras día.`],
['Me enamoré de ti',`Me enamoré de tu cabello ondulado, que me encanta ver y tocar. De tus ojos color miel me encanta cuando tu mirada se concentra en mí. De tus labios rosas que me encanta besar, de esos besos que me dejan la mente en blanco.

Me enamoré de tu olor delicioso, de esos abrazos que me hacen sentir el calor de tu cuerpo. Cuando estoy contigo me siento contento y relajado y lo demás deja de importar.

Amo cuando te quedas dormida en mi hombro, amo cuando tocas mi cabello. Amo cuando me dices te amo, amo todo eso que haces estando conmigo.

Amo cuando vas a mis partidos de football y te veo ahí apoyándome desde las gradas y hacemos esa señal que es única. Amo ver todas las fotos que tenemos juntos. Amo cuando hablamos de un posible futuro juntos, cuando planeamos salir aunque al final nada salga como lo planeamos, porque lo divertido es estar contigo pasar tiempo contigo a como de lugar.

Y amo cuando leo las cartas que me hiciste, las leo y me vuelvo a enamorar de ti otra vez.

Hace un año te conozco y hace un mes eres mi mujer, quiero que sigan siendo muchos más meses, muchos más años, abrazos y besos y sueños contigo.

Te amo muchísimo`]];

const S=[['Mis fotos favoritas',[159,160,161]],['Momentos inolvidables',[163,164,165,166,167,168]],['Fotos randoms',[175,176,177]],['La primera vez que conocí a tus papás',[178,179]]];
const V=['VID-20261016-WA0059.mp4','VID-20261016-WA0060.mp4','VID-20261016-WA0061.mp4','VID-20261016-WA0062.mp4','VID-20261014-WA0180.mp4'];

const go=id=>{$$('.s').forEach(e=>e.classList.remove('on'));const e=$('#'+id);e.classList.add('on');e.scrollTop=0};

let fg='';
for(let i=0;i<11;i++){const x=6+i*5.2,d=`${18+i*37%21} ${3+i*7%5}`;
  fg+=i<3?`<ellipse cx="60" cy="72" rx="${x}" ry="${x*1.3}" stroke-dasharray="${d}"/>`
  :`<path d="M${60-x} ${118+i*2}V72A${x} ${x*1.12} 0 0 1 ${60+x} 72V${118+i*2}" stroke-dasharray="${d}"/>`}
$('#fg').innerHTML=fg;

const fp=$('#fp'),st=$('#st');let hold;
const press=()=>{if(fp.classList.contains('ok'))return;fp.classList.add('go');st.textContent='Escaneando…';
  hold=setTimeout(()=>{fp.classList.add('ok');st.textContent='Te amo ♥';navigator.vibrate&&navigator.vibrate(80);setTimeout(()=>go('m'),1100)},2600)};
const lift=()=>{if(fp.classList.contains('ok'))return;clearTimeout(hold);fp.classList.remove('go');st.textContent='Mantén presionada la huella'};
fp.onpointerdown=press;
['pointerup','pointerleave','pointercancel'].forEach(t=>fp.addEventListener(t,lift));
fp.oncontextmenu=e=>e.preventDefault();
fp.onkeydown=e=>{if((e.key==' '||e.key=='Enter')&&!e.repeat){e.preventDefault();press()}};
fp.onkeyup=lift;

const closeL=()=>{$('#mo').classList.remove('on');$$('.env').forEach(e=>e.classList.remove('open'))};
$$('.env').forEach(b=>b.onclick=()=>{b.classList.add('open');
  setTimeout(()=>{const l=L[b.dataset.n];$('#lt').textContent=l[0];$('#lx').textContent=l[1];$('#mo').classList.add('on')},650)});
$('#mo').onclick=e=>{if(e.target.id=='mo'||e.target.className=='x')closeL()};
$('#lb').onclick=()=>$('#lb').classList.remove('on');
onkeydown=e=>{if(e.key=='Escape'){closeL();$('#lb').classList.remove('on')}};
$('#bk').onclick=()=>go('m');

let built=0;
$('#ab').onclick=()=>{go('a');if(built)return;built=1;
  const im=n=>`IMG-20261014-WA0${n}.jpg`;
  $('#al').innerHTML=S.map(([t,a])=>`<h2>${t}</h2><div class="g">${a.map(n=>`<img loading="lazy" src="${D+im(n)}" alt="${im(n)}">`).join('')}</div>`).join('')
   +`<h2>Videos randoms</h2><p class="sub">Toca un video para activar o quitar el sonido</p><div class="g">${V.map(f=>`<video src="${D+f}" muted autoplay loop playsinline preload="metadata"></video>`).join('')}</div>`;
  const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting?e.target.play().catch(()=>{}):e.target.pause()),{threshold:.25});
  $$('#al video').forEach(v=>{v.muted=true;io.observe(v)})};
$('#al').onclick=e=>{const t=e.target;
  if(t.tagName=='IMG'){$('#li').src=t.src;$('#lb').classList.add('on')}
  else if(t.tagName=='VIDEO')t.muted=!t.muted};

const hearts=(n,burst)=>{for(let i=0;i<n;i++){const h=document.createElement('i');h.className='h';h.textContent='♥';
  h.style.cssText=`left:${Math.random()*100}%;font-size:${.8+Math.random()*1.4}rem;`+(burst
    ?`opacity:.85;z-index:30;animation:rise ${3+Math.random()*3}s ${Math.random()*1.2}s ease-out both`
    :`animation-duration:${10+Math.random()*10}s;animation-delay:-${Math.random()*14}s`);
  document.body.append(h)}};
hearts(14);

$('#qb').onclick=()=>go('q');
const yes=$('#yes'),no=$('#no'),qm=$('#qm'),M=['¿que piensas o que?','¿que piensas o que?','¿que piensas o que?','¿que piensas o que?','¿que piensas o que?'];
let n=0,flip=0;
const HEART='<svg class="big" viewBox="0 0 100 90"><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f58ba7"/><stop offset="1" stop-color="#a8153b"/></linearGradient></defs><path fill="url(#hg)" d="M50 88C20 62 2 44 2 26C2 12 13 3 26 3C36 3 45 9 50 18C55 9 64 3 74 3C87 3 98 12 98 26C98 44 80 62 50 88Z"/></svg>';
const win=()=>{$('#q h1').textContent='¡Sabía que dirías que sí!';qm.textContent='Te amo muchísimo ♥';const y=$('.yn');y.style.marginTop='2rem';y.innerHTML=HEART;hearts(60,1)};
const nope=()=>{
  if(flip)return win();
  if(++n>5){flip=1;no.textContent='Sí';no.classList.add('yes');qm.textContent='ahora no tienes opcion';return}
  $('#dt').textContent=M[n-1];$('#dog').src=D+'1000268678.png';go('d')};
no.onclick=nope;
yes.onclick=win;
$('#back').onclick=()=>{go('q');setTimeout(()=>yes.style.transform=`scale(${1+n*.4})`,350)};
</script>
</body>
</html>
